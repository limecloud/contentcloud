name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: contentcloud
          POSTGRES_PASSWORD: contentcloud-test
          POSTGRES_DB: contentcloud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contentcloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CONTENTCLOUD_TEST_DATABASE_URL: postgres://contentcloud:contentcloud-test@localhost:5432/contentcloud_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: test -z "$(gofmt -l ./cmd ./internal ./contracts ./migrations ./skills)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - run: node --check packages/contentcloud/bin/contentcloud.js

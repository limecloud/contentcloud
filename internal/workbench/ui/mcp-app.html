<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Content Work OS 本地工作台</title>
  <style>
    :root { color-scheme: light dark; font: 14px/1.5 system-ui, sans-serif; }
    body { margin: 0; padding: 16px; background: Canvas; color: CanvasText; }
    main { display: grid; gap: 12px; max-width: 720px; }
    h1, p { margin: 0; }
    h1 { font-size: 18px; }
    .status { color: GrayText; }
    pre { margin: 0; padding: 12px; overflow: auto; border: 1px solid ButtonBorder; border-radius: 6px; white-space: pre-wrap; word-break: break-word; }
    a { color: LinkText; }
  </style>
</head>
<body>
  <main>
    <h1>Content Work OS 本地工作台</h1>
    <p id="status" class="status">正在连接宿主...</p>
    <pre id="result">等待 workspace_open_workbench 工具结果。</pre>
  </main>
  <script>
    (() => {
      'use strict';
      const status = document.querySelector('#status');
      const result = document.querySelector('#result');
      const pending = new Map();
      let nextID = 1;

      function showToolResult(params) {
        const value = params && typeof params === 'object' ? params : {};
        const structured = value.structuredContent;
        result.textContent = JSON.stringify(structured || value, null, 2);
        const handoff = value._meta && value._meta['run.zhongcao.contentcloud/browserHandoff'];
        if (handoff && typeof handoff.url === 'string') {
          const link = document.createElement('a');
          link.href = handoff.url;
          link.target = '_blank';
          link.rel = 'noreferrer';
          link.textContent = '在安全的本地浏览器中打开完整工作台';
          result.after(link);
        }
      }

      window.addEventListener('message', (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || typeof message !== 'object') return;
        if (message.method === 'ui/notifications/tool-result') {
          showToolResult(message.params);
          return;
        }
        if (message.method === 'ui/notifications/tool-cancelled') {
          status.textContent = '工具调用已取消';
          return;
        }
        if (message.id === undefined) return;
        const request = pending.get(String(message.id));
        if (!request) return;
        pending.delete(String(message.id));
        if (message.error) request.reject(new Error(message.error.message || '宿主请求失败'));
        else request.resolve(message.result || {});
      });

      function request(method, params) {
        const id = String(nextID++);
        return new Promise((resolve, reject) => {
          pending.set(id, {resolve, reject});
          window.parent.postMessage({jsonrpc: '2.0', id, method, params}, '*');
        });
      }

      request('ui/initialize', {
        protocolVersion: '2025-11-25',
        appInfo: {name: 'contentcloud-workbench', version: '0.27.0'},
        appCapabilities: {}
      }).then(() => {
        status.textContent = '已连接 MCP Apps 宿主';
        window.parent.postMessage({jsonrpc: '2.0', method: 'ui/notifications/initialized', params: {}}, '*');
      }).catch((error) => {
        status.textContent = `宿主连接失败：${error.message}`;
      });
    })();
  </script>
</body>
</html>

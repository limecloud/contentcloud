        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        approved_snapshot_ids: {type: array, minItems: 1, uniqueItems: true, items: {type: string, format: uuid}}
        script_id: {type: string}
        status: {const: ready}
        manifest: {type: array, minItems: 3, maxItems: 3, items: {$ref: '#/components/schemas/Artifact'}}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
    ArtifactPresentation:
      type: object

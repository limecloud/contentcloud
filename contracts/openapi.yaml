        subject_type: {type: string, enum: [approved_snapshot, script_version, content_framework, shot_pattern]}
        subject_id: {type: string, format: uuid}
        observation_ids: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {type: string, format: uuid}}
        rating: {type: string, enum: [insufficient_sample, seed_candidate, repairable, discarded]}
        reason: {type: string}

openapi: 3.1.0
info:
  title: ContentCloud Private Transport
  version: 1.0.0
  description: >-
    Private same-origin Web BFF, public review BFF, and CLI transport. This is not
    a public SDK. Agents, renderers, scripts, and CI use the contentcloud CLI.
    The cloud control plane never accepts LLM prompts, model credentials, or
    arbitrary execution requests.
servers:
  - url: /api
tags:
  - {name: Bootstrap, description: Public Agent-readable project initialization protocol}
  - {name: CLI, description: Private transport used only by the Go CLI}
  - {name: Web BFF, description: Same-origin human Web application}
  - {name: Studio BFF, description: Same-origin customer creation projection without runtime internals}
  - {name: Runtime Admin, description: Operations-only execution observation and controls}
  - {name: Admin, description: Same-origin platform administrator control plane}
  - {name: Review BFF, description: Token-bound customer approval projection}
x-json-read: &jsonRead
  tags: [Web BFF]
  security: [{cookieAuth: []}]
  responses:
    '200': {$ref: '#/components/responses/Success'}
    '401': {$ref: '#/components/responses/Error'}
    '404': {$ref: '#/components/responses/Error'}
x-json-write: &jsonWrite
  tags: [Web BFF]
  security: [{cookieAuth: []}]
  requestBody:
    required: true
    content:
      application/json: {schema: {type: object}}
  responses:
    '200': {$ref: '#/components/responses/Success'}
    '400': {$ref: '#/components/responses/Error'}
    '401': {$ref: '#/components/responses/Error'}
    '403': {$ref: '#/components/responses/Error'}
    '409': {$ref: '#/components/responses/Error'}
x-public-json-write: &publicJSONWrite
  tags: [Review BFF]
  requestBody:
    required: true
    content:
      application/json: {schema: {type: object}}
  responses:
    '200': {$ref: '#/components/responses/Success'}
    '400': {$ref: '#/components/responses/Error'}
    '401': {$ref: '#/components/responses/Error'}
    '409': {$ref: '#/components/responses/Error'}
x-admin-json-read: &adminJSONRead
  tags: [Admin]
  security: [{cookieAuth: []}]
  responses:
    '200': {$ref: '#/components/responses/Success'}
    '401': {$ref: '#/components/responses/Error'}
    '403': {$ref: '#/components/responses/Error'}
    '404': {$ref: '#/components/responses/Error'}
x-admin-json-write: &adminJSONWrite
  tags: [Admin]
  security: [{cookieAuth: []}]
  requestBody:
    required: true
    content:
      application/json: {schema: {type: object}}
  responses:
    '200': {$ref: '#/components/responses/Success'}
    '400': {$ref: '#/components/responses/Error'}
    '401': {$ref: '#/components/responses/Error'}
    '403': {$ref: '#/components/responses/Error'}
    '404': {$ref: '#/components/responses/Error'}
paths:
  /bootstrap:
    get:
      tags: [Bootstrap]
      operationId: getAgentBootstrap
      summary: Read the ContentCloud Agent initialization protocol
      security: []
      responses:
        '200':
          description: Agent-readable Markdown instructions
          headers:
            Cache-Control: {schema: {type: string}, description: Always `no-cache`}
          content:
            text/markdown:
              schema: {type: string}
  /v1/auth/register:
    post: *publicJSONWrite
  /v1/auth/login:
    post: *publicJSONWrite
  /v1/cli/dispatch:
    post:
      tags: [CLI]
      operationId: dispatchCLICommand
      security: [{bearerAuth: []}, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DispatchRequest'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '204': {description: No daemon task is available}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /v1/providers/{provider_id}/tenants/{tenant_id}/callbacks:
    parameters:
      - {name: provider_id, in: path, required: true, schema: {type: string}}
      - {name: tenant_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Runtime Admin]
      operationId: receiveProviderCallback
      summary: Receive a signed provider callback into the Runtime inbox
      security: []
      parameters:
        - {name: X-ContentCloud-Timestamp, in: header, required: true, schema: {type: string}}
        - {name: X-ContentCloud-Signature, in: header, required: true, schema: {type: string, pattern: '^sha256='}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_id, external_id, provider_state]
              properties:
                job_run_id: {type: string}
                effect_id: {type: string}
                message_id: {type: string}
                external_id: {type: string}
                provider_state: {type: string}
                response_digest: {type: string}
                cost_minor: {type: integer, format: int64, minimum: 0}
                currency: {type: string, pattern: '^[A-Z]{3}$'}
                safe_payload: {type: object, additionalProperties: true}
                error_code: {type: string}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /v1/channels/{adapter_id}/tenants/{tenant_id}/callbacks:
    parameters:
      - {name: adapter_id, in: path, required: true, schema: {type: string, minLength: 1}}
      - {name: tenant_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Runtime Admin]
      operationId: receiveChannelCallback
      summary: Receive a signed, deduplicated channel delivery receipt
      security: []
      parameters:
        - {name: X-ContentCloud-Timestamp, in: header, required: true, schema: {type: string, pattern: '^[0-9]+$'}}
        - {name: X-ContentCloud-Signature, in: header, required: true, schema: {type: string, pattern: '^sha256=[a-f0-9]{64}$'}}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/ReceiveChannelCallbackInput'}}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /v1/agent-harnesses/{harness_kind}/tenants/{tenant_id}/callbacks:
    parameters:
      - {name: harness_kind, in: path, required: true, schema: {type: string, enum: [remote-http, pi, agent-saas]}}
      - {name: tenant_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Runtime Admin]
      operationId: receiveAgentHarnessCallback
      summary: Durably receive and apply a signed remote Agent Harness event
      description: >-
        Persists the message in the shared Runtime provider inbox before applying it to
        the bound RuntimeAttempt. The same message ID and digest resume safely after a
        crash; a changed digest conflicts.
      security: []
      parameters:
        - {name: X-ContentCloud-Timestamp, in: header, required: true, schema: {type: string, pattern: '^[0-9]+$'}}
        - {name: X-ContentCloud-Signature, in: header, required: true, schema: {type: string, pattern: '^sha256=[a-f0-9]{64}$'}}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/AgentHarnessCallbackInput'}}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /v1/providers/{provider_id}/tenants/{tenant_id}/bills:
    parameters:
      - {name: provider_id, in: path, required: true, schema: {type: string}}
      - {name: tenant_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Runtime Admin]
      operationId: recordProviderBill
      summary: Record a signed provider bill for Runtime reconciliation
      security: []
      parameters:
        - {name: X-ContentCloud-Timestamp, in: header, required: true, schema: {type: string}}
        - {name: X-ContentCloud-Signature, in: header, required: true, schema: {type: string, pattern: '^sha256='}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bill_id, external_id, amount_minor]
              properties:
                job_run_id: {type: string}
                effect_id: {type: string}
                bill_id: {type: string}
                external_id: {type: string}
                bill_digest: {type: string}
                amount_minor: {type: integer, format: int64, minimum: 0}
                currency: {type: string, pattern: '^[A-Z]{3}$'}
                observed_at: {type: string, format: date-time}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /v1/admin/dashboard:
    get: *adminJSONRead
  /v1/admin/runtime-health:
    get: *adminJSONRead
  /v1/admin/tenants/{tenant_id}:
    parameters: [{name: tenant_id, in: path, required: true, schema: {type: string, format: uuid}}]
    patch: *adminJSONWrite
  /studio/bootstrap:
    get:
      tags: [Studio BFF]
      operationId: getStudioBootstrap
      summary: Read the customer creation session, projects, and published experiences
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Customer Studio bootstrap projection
          content:
            application/json: {schema: {$ref: '#/components/schemas/StudioBootstrapEnvelope'}}
        '401': {$ref: '#/components/responses/Error'}
  /studio/execution-clients:
    get:
      tags: [Studio BFF]
      operationId: listStudioExecutionClients
      summary: List supported local execution clients for customer workspace connection
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Supported execution client catalog
          content:
            application/json: {schema: {$ref: '#/components/schemas/StudioExecutionClientCatalogEnvelope'}}
        '401': {$ref: '#/components/responses/Error'}
  /studio/projects/{project_id}/connect-sessions:
    parameters: [{name: project_id, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      tags: [Studio BFF]
      operationId: createStudioConnectSession
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Created customer execution-client connection session
          content:
            application/json: {schema: {$ref: '#/components/schemas/StudioConnectSessionEnvelope'}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /studio/connect-sessions/{session_id}:
    parameters: [{name: session_id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      tags: [Studio BFF]
      operationId: getStudioConnectSession
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Current customer execution-client connection state
          content:
            application/json: {schema: {$ref: '#/components/schemas/StudioConnectSessionEnvelope'}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /studio/connect-sessions/{session_id}/approve:
    parameters: [{name: session_id, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      tags: [Studio BFF]
      operationId: approveStudioConnectSession
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Approved customer execution-client connection
          content:
            application/json: {schema: {$ref: '#/components/schemas/StudioConnectSessionEnvelope'}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /studio/connect-sessions/{session_id}/deny:
    parameters: [{name: session_id, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      tags: [Studio BFF]
      operationId: denyStudioConnectSession
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Denied customer execution-client connection
          content:
            application/json: {schema: {$ref: '#/components/schemas/StudioConnectSessionEnvelope'}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /studio/connect-sessions/{session_id}/cancel:
    parameters: [{name: session_id, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      tags: [Studio BFF]
      operationId: cancelStudioConnectSession
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Canceled customer execution-client connection
          content:
            application/json: {schema: {$ref: '#/components/schemas/StudioConnectSessionEnvelope'}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /studio/session/switch:
    post:
      tags: [Studio BFF]
      operationId: switchStudioTenant
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tenant_id]
              properties: {tenant_id: {type: string, format: uuid}}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /studio/session/logout:
    post:
      tags: [Studio BFF]
      operationId: logoutStudioSession
      security: [{cookieAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '401': {$ref: '#/components/responses/Error'}
  /studio/tasks:
    get:
      tags: [Studio BFF]
      operationId: listStudioTasks
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Customer-facing task summaries
          content:
            application/json: {schema: {$ref: '#/components/schemas/StudioTaskListEnvelope'}}
        '401': {$ref: '#/components/responses/Error'}
    post:
      tags: [Studio BFF]
      operationId: createStudioTask
      security: [{cookieAuth: []}]
      parameters:
        - {name: Idempotency-Key, in: header, required: false, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/StudioCreateTaskInput'}}
      responses:
        '200':
          description: Created or idempotently replayed customer task
          content:
            application/json: {schema: {$ref: '#/components/schemas/StudioTaskEnvelope'}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /studio/tasks/{task_id}:
    parameters: [{name: task_id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      tags: [Studio BFF]
      operationId: getStudioTask
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Customer-facing task detail
          content:
            application/json: {schema: {$ref: '#/components/schemas/StudioTaskEnvelope'}}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /studio/tasks/{task_id}/actions:
    parameters: [{name: task_id, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      tags: [Studio BFF]
      operationId: actOnStudioTask
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties: {action: {type: string, enum: [start, pause, resume, retry]}}
      responses:
        '200':
          description: Updated customer task
          content:
            application/json: {schema: {$ref: '#/components/schemas/StudioTaskEnvelope'}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /studio/tasks/{task_id}/inspirations:
    parameters: [{name: task_id, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      tags: [Studio BFF]
      operationId: addStudioInspiration
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/StudioAddInspirationInput'}}
      responses:
        '200':
          description: Updated customer task
          content:
            application/json: {schema: {$ref: '#/components/schemas/StudioTaskEnvelope'}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /studio/tasks/{task_id}/decisions/{decision_id}:
    parameters:
      - {name: task_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: decision_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Studio BFF]
      operationId: decideStudioTaskResult
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: {type: string, enum: [approved, changes_requested]}
                reason: {type: string}
      responses:
        '200':
          description: Updated customer task
          content:
            application/json: {schema: {$ref: '#/components/schemas/StudioTaskEnvelope'}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /studio/tasks/{task_id}/assets:
    parameters: [{name: task_id, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      tags: [Studio BFF]
      operationId: attachStudioTaskAssets
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [asset_refs]
              properties: {asset_refs: {type: array, items: {type: string}}}
      responses:
        '200':
          description: Updated customer task
          content:
            application/json: {schema: {$ref: '#/components/schemas/StudioTaskEnvelope'}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /studio/tasks/{task_id}/materials:
    parameters: [{name: task_id, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      tags: [Studio BFF]
      operationId: attachStudioTaskMaterials
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [material_refs]
              properties: {material_refs: {type: array, items: {type: string}}}
      responses:
        '200':
          description: Updated customer task
          content:
            application/json: {schema: {$ref: '#/components/schemas/StudioTaskEnvelope'}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /studio/assets:
    get:
      tags: [Studio BFF]
      operationId: listStudioAssets
      security: [{cookieAuth: []}]
      parameters:
        - {name: project_id, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Customer asset surface combining workspace materials, creative results, and recent projections
          content:
            application/json: {schema: {$ref: '#/components/schemas/StudioAssetSurfaceEnvelope'}}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /studio/assets/results/{result_id}:
    parameters:
      - {name: result_id, in: path, required: true, schema: {type: string}}
      - {name: task_id, in: query, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Studio BFF]
      operationId: showStudioCreativeResult
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Customer-safe render data for one immutable creative result
          content:
            application/json: {schema: {$ref: '#/components/schemas/StudioCreativeResultDetailEnvelope'}}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /studio/asset-folders:
    post:
      tags: [Studio BFF]
      operationId: createStudioAssetFolder
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/WorkspaceFolderCreateInput'}}
      responses:
        '200':
          description: Created customer workspace folder
          content:
            application/json: {schema: {$ref: '#/components/schemas/WorkspaceFolderEnvelope'}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /studio/materials:
    post:
      tags: [Studio BFF]
      operationId: uploadStudioMaterial
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data: {schema: {$ref: '#/components/schemas/WorkspaceMaterialUploadInput'}}
      responses:
        '200':
          description: Created customer workspace material projection
          content:
            application/json: {schema: {$ref: '#/components/schemas/WorkspaceMaterialEnvelope'}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /studio/materials/{id}/download:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      tags: [Studio BFF]
      operationId: downloadStudioMaterial
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Authorized workspace material bytes
          content: {application/octet-stream: {schema: {type: string, format: binary}}}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /studio/deliveries:
    get:
      tags: [Studio BFF]
      operationId: listStudioDeliveries
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Delivery packages and confirmed publication records
          content:
            application/json: {schema: {$ref: '#/components/schemas/StudioDeliveriesEnvelope'}}
        '401': {$ref: '#/components/responses/Error'}
  /studio/artifacts/{id}/download:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      tags: [Studio BFF]
      operationId: downloadStudioArtifact
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Authorized artifact bytes
          content: {application/octet-stream: {schema: {type: string, format: binary}}}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /bff/runtime/jobs:
    get:
      tags: [Runtime Admin]
      operationId: listRuntimeJobs
      security: [{cookieAuth: []}]
      parameters:
        - {name: project_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: state, in: query, required: false, schema: {type: string}}
        - {name: after, in: query, required: false, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Operations-only Runtime job list
          content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeJobListEnvelope'}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /bff/runtime/jobs/{job_id}:
    parameters: [{name: job_id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      tags: [Runtime Admin]
      operationId: getRuntimeJob
      security: [{cookieAuth: []}]
      responses:
        '200': {description: Runtime job detail, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeJobDetailEnvelope'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /bff/runtime/jobs/{job_id}/nodes:

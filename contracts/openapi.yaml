components:
  securitySchemes:
    cookieAuth: {type: apiKey, in: cookie, name: cc_session}
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    ProjectID: {name: project_id, in: path, required: true, schema: {type: string, format: uuid}}
    ID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    ReviewToken: {name: token, in: path, required: true, schema: {type: string, pattern: '^crg_[A-Za-z0-9_-]+$'}}
  schemas:
    RuntimeJobSummary:
      type: object
      additionalProperties: false
      required: [id, work_task_id, task_title, project_id, project_name, state, plan_digest, priority, node_count, node_states, effect_count, checkpoint_count, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        work_task_id: {type: string, format: uuid}
        business_type: {type: string}
        task_title: {type: string}
        project_id: {type: string, format: uuid}
        project_name: {type: string}
        state: {type: string}
        plan_digest: {type: string}
        priority: {type: integer}
        error_code: {type: string}
        node_count: {type: integer, minimum: 0}
        node_states: {type: object, additionalProperties: {type: integer, minimum: 0}}
        effect_count: {type: integer, minimum: 0}
        checkpoint_count: {type: integer, minimum: 0}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    RuntimeJobList:
      type: object
      additionalProperties: false
      required: [items, generated_at]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/RuntimeJobSummary'}}
        next_after: {type: integer, minimum: 0}
        generated_at: {type: string, format: date-time}
    RuntimeNodeView:
      type: object
      additionalProperties: false
      required: [id, node_key, name, kind, state, attempt_count, updated_at]
      properties:
        id: {type: string, format: uuid}
        node_key: {type: string}
        name: {type: string}
        kind: {type: string}
        customer_step_id: {type: string}
        state: {type: string}
        attempt_count: {type: integer, minimum: 0}
        output_digest: {type: string}
        error_code: {type: string}
        lease_owner: {type: string}
        updated_at: {type: string, format: date-time}
    RuntimeEventView:
      type: object
      additionalProperties: false
      required: [id, sequence, type, actor_type, payload, occurred_at]
      properties:
        id: {type: string, format: uuid}
        sequence: {type: integer, minimum: 1}
        type: {type: string}
        node_key: {type: string}
        actor_type: {type: string}
        payload: {type: object}
        occurred_at: {type: string, format: date-time}
    RuntimeEffectView:
      type: object
      additionalProperties: false
      required: [id, node_run_id, kind, state, request_digest, cost_minor, currency, safe_summary, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        node_run_id: {type: string, format: uuid}
        kind: {type: string}
        state: {type: string}
        external_id: {type: string}
        request_digest: {type: string}
        response_digest: {type: string}
        cost_minor: {type: integer}
        currency: {type: string}
        safe_summary: {type: object}
        error_code: {type: string}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    RuntimeCheckpointView:
      type: object
      additionalProperties: false
      required: [id, node_key, plan_digest, state_ref_count, output_ref_count, completed_nodes, digest, created_at]
      properties:
        id: {type: string, format: uuid}
        node_key: {type: string}
        plan_digest: {type: string}
        state_ref_count: {type: integer, minimum: 0}
        output_ref_count: {type: integer, minimum: 0}
        completed_nodes: {type: array, items: {type: string}}
        digest: {type: string}
        created_at: {type: string, format: date-time}
    RuntimeContextView:
      type: object
      additionalProperties: false
      required: [id, node_run_id, attempt_id, schema_version, input_ref_count, state_ref_count, event_ref_count, allowed_tools, max_tokens, budget_minor, digest, created_at, expires_at]
      properties:
        id: {type: string, format: uuid}
        node_run_id: {type: string, format: uuid}
        attempt_id: {type: string}
        schema_version: {type: string}
        input_ref_count: {type: integer, minimum: 0}
        state_ref_count: {type: integer, minimum: 0}
        event_ref_count: {type: integer, minimum: 0}
        allowed_tools: {type: array, items: {type: string}}
        max_tokens: {type: integer, minimum: 1}
        budget_minor: {type: integer, minimum: 0}
        digest: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    RuntimeAgentView:
      type: object
      additionalProperties: false
      required: [id, node_run_id, role, harness_kind, execution_profile_id, context_view_id, session_bound, state, depth, remaining_descendants, budget_minor, used_cost_minor, version, context_view, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        node_run_id: {type: string, format: uuid}
        parent_agent_instance_id: {type: string, format: uuid}
        role: {type: string}
        harness_kind: {type: string}
        execution_profile_id: {type: string}
        context_view_id: {type: string, format: uuid}
        session_bound: {type: boolean}
        state: {type: string}

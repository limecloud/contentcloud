      type: object
      additionalProperties: false
      required: [row_number, code, message]
      properties:
        row_number: {type: integer, minimum: 1}
        field: {type: string}
        code: {type: string}
        message: {type: string}
    PerformanceObservationInput:
      type: object
      additionalProperties: false
      required: [platform, account_alias, published_at, window_hours, sample_status, metrics]
      oneOf:
        - required: [approved_snapshot_id]
          not: {required: [script_version_id]}
        - required: [script_version_id]
          not: {required: [approved_snapshot_id]}
      properties:
        row_number: {type: integer, minimum: 1}
        project_id: {type: string, format: uuid}
        approved_snapshot_id: {type: string, format: uuid}
        script_version_id: {type: string, format: uuid, deprecated: true, description: Read/import compatibility for V1 records only; mutually exclusive with approved_snapshot_id.}
        platform: {type: string, minLength: 1}
        account_alias: {type: string, minLength: 1}
        published_at: {type: string, format: date-time}
        window_hours: {type: integer, minimum: 1, maximum: 8760}
        sample_status: {type: string, enum: [insufficient_sample, seed_candidate, repairable, discarded]}
        metrics:
          type: object
          propertyNames: {enum: [impressions, views, three_second_retention_rate, completion_rate, clicks, conversions, likes, comments, shares]}
          additionalProperties: {type: number, minimum: 0}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        spend: {type: number, minimum: 0, default: 0}
        gmv: {type: number, minimum: 0, default: 0}
        roi: {type: number, description: Accepted for import compatibility but ignored; the server calculates persisted ROI from GMV and spend.}
        issue_category: {type: string, enum: ['', creative, account, delivery, landing]}
        notes: {type: string}
    PerformanceImportInput:
      type: object
      additionalProperties: false
      required: [source_name, source_format, observations]
      properties:
        project_id: {type: string, format: uuid, description: CLI transport only; Web BFF derives it from the route.}
        source_name: {type: string, minLength: 1, maxLength: 255}
        source_format: {type: string, enum: [manual, json, csv, xlsx]}
        source_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        observations: {type: array, minItems: 1, maxItems: 1000, items: {$ref: '#/components/schemas/PerformanceObservationInput'}}
        dry_run: {type: boolean, default: false}
    PerformanceImportBatch:
      type: object
      additionalProperties: false
      required: [id, tenant_id, project_id, source_name, source_format, source_sha256, row_count, imported_count, status, created_by, created_at]
      properties:
        id: {type: string, description: UUID when persisted; empty only in a dry-run result.}
        tenant_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        source_name: {type: string}
        source_format: {type: string, enum: [manual, json, csv, xlsx]}
        source_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        row_count: {type: integer, minimum: 1, maximum: 1000}
        imported_count: {type: integer, minimum: 1, maximum: 1000}
        status: {type: string, enum: [validated, imported]}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
    PerformanceObservation:
      type: object
      additionalProperties: false
      required: [id, tenant_id, project_id, import_batch_id, row_number, platform, account_alias, published_at, window_hours, sample_status, metrics, spend, gmv, dedup_key, issue_category, notes, created_at]
      properties:
        id: {type: string, description: UUID when persisted; empty only in a dry-run result.}
        tenant_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        import_batch_id: {type: string}
        row_number: {type: integer, minimum: 1}
        approved_snapshot_id: {type: string, format: uuid}
        script_version_id: {type: string, format: uuid, deprecated: true}
        platform: {type: string}
        account_alias: {type: string}
        published_at: {type: string, format: date-time}
        window_hours: {type: integer, minimum: 1, maximum: 8760}
        sample_status: {type: string, enum: [insufficient_sample, seed_candidate, repairable, discarded]}
        metrics: {type: object, additionalProperties: {type: number, minimum: 0}}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        spend: {type: number, minimum: 0}
        gmv: {type: number, minimum: 0}
        roi: {type: number, minimum: 0, description: Server-computed GMV divided by spend.}
        dedup_key: {type: string, pattern: '^[a-f0-9]{64}$'}
        issue_category: {type: string, enum: ['', creative, account, delivery, landing]}
        notes: {type: string}
        created_at: {type: string, format: date-time}
    PerformanceImportResult:
      type: object
      additionalProperties: false
      required: [dry_run, batch, observations]
      properties:
        dry_run: {type: boolean}
        batch: {$ref: '#/components/schemas/PerformanceImportBatch'}
        observations: {type: array, items: {$ref: '#/components/schemas/PerformanceObservation'}}
    PerformanceImportDetails:
      type: object
      additionalProperties: false
      required: [batch, observations]
      properties:
        batch: {$ref: '#/components/schemas/PerformanceImportBatch'}
        observations: {type: array, items: {$ref: '#/components/schemas/PerformanceObservation'}}
    CreateRatingDecisionInput:

openapi: 3.1.0
info:
  title: ContentCloud Private Transport
  version: 1.0.0
  description: >-
    Private same-origin Web BFF, public review BFF, and CLI transport. This is not
    a public SDK. Agents, renderers, scripts, and CI use the contentcloud CLI.
    The cloud control plane never accepts LLM prompts, model credentials, or
    arbitrary execution requests.
servers:
  - url: /api
tags:
  - {name: Bootstrap, description: Public Agent-readable project initialization protocol}
  - {name: CLI, description: Private transport used only by the Go CLI}
  - {name: Web BFF, description: Same-origin human Web application}
  - {name: Studio BFF, description: Same-origin customer creation projection without runtime internals}
  - {name: Runtime Admin, description: Operations-only execution observation and controls}
  - {name: Admin, description: Same-origin platform administrator control plane}
  - {name: Review BFF, description: Token-bound customer approval projection}
x-json-read: &jsonRead
  tags: [Web BFF]
  security: [{cookieAuth: []}]
  responses:
    '200': {$ref: '#/components/responses/Success'}
    '401': {$ref: '#/components/responses/Error'}
    '404': {$ref: '#/components/responses/Error'}
x-json-write: &jsonWrite
  tags: [Web BFF]
  security: [{cookieAuth: []}]
  requestBody:
    required: true
    content:
      application/json: {schema: {type: object}}
  responses:
    '200': {$ref: '#/components/responses/Success'}
    '400': {$ref: '#/components/responses/Error'}
    '401': {$ref: '#/components/responses/Error'}
    '403': {$ref: '#/components/responses/Error'}
    '409': {$ref: '#/components/responses/Error'}
x-public-json-write: &publicJSONWrite
  tags: [Review BFF]
  requestBody:
    required: true
    content:
      application/json: {schema: {type: object}}
  responses:
    '200': {$ref: '#/components/responses/Success'}
    '400': {$ref: '#/components/responses/Error'}
    '401': {$ref: '#/components/responses/Error'}
    '409': {$ref: '#/components/responses/Error'}
x-admin-json-read: &adminJSONRead
  tags: [Admin]
  security: [{cookieAuth: []}]
  responses:
    '200': {$ref: '#/components/responses/Success'}
    '401': {$ref: '#/components/responses/Error'}
    '403': {$ref: '#/components/responses/Error'}
    '404': {$ref: '#/components/responses/Error'}
x-admin-json-write: &adminJSONWrite
  tags: [Admin]
  security: [{cookieAuth: []}]
  requestBody:
    required: true
    content:
      application/json: {schema: {type: object}}
  responses:
    '200': {$ref: '#/components/responses/Success'}
    '400': {$ref: '#/components/responses/Error'}
    '401': {$ref: '#/components/responses/Error'}
    '403': {$ref: '#/components/responses/Error'}
    '404': {$ref: '#/components/responses/Error'}
paths:
  /bootstrap:
    get:
      tags: [Bootstrap]
      operationId: getAgentBootstrap
      summary: Read the ContentCloud Agent initialization protocol
      security: []
      responses:
        '200':
          description: Agent-readable Markdown instructions
          headers:
            Cache-Control: {schema: {type: string}, description: Always `no-cache`}
          content:
            text/markdown:
              schema: {type: string}
  /v1/auth/register:
    post: *publicJSONWrite
  /v1/auth/login:
    post: *publicJSONWrite
  /v1/cli/dispatch:
    post:
      tags: [CLI]
      operationId: dispatchCLICommand
      security: [{bearerAuth: []}, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DispatchRequest'}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '204': {description: No daemon task is available}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /v1/admin/dashboard:
    get: *adminJSONRead
  /v1/admin/tenants/{tenant_id}:
    parameters: [{name: tenant_id, in: path, required: true, schema: {type: string, format: uuid}}]
    patch: *adminJSONWrite
  /studio/bootstrap:
    get:
      tags: [Studio BFF]
      operationId: getStudioBootstrap
      summary: Read the customer creation session, projects, and published experiences
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Customer Studio bootstrap projection
          content:
            application/json: {schema: {$ref: '#/components/schemas/StudioBootstrapEnvelope'}}
        '401': {$ref: '#/components/responses/Error'}
  /studio/session/switch:
    post:
      tags: [Studio BFF]
      operationId: switchStudioTenant
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tenant_id]
              properties: {tenant_id: {type: string, format: uuid}}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /studio/session/logout:
    post:
      tags: [Studio BFF]
      operationId: logoutStudioSession
      security: [{cookieAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '401': {$ref: '#/components/responses/Error'}
  /studio/tasks:
    get:
      tags: [Studio BFF]
      operationId: listStudioTasks
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Customer-facing task summaries
          content:
            application/json: {schema: {$ref: '#/components/schemas/StudioTaskListEnvelope'}}
        '401': {$ref: '#/components/responses/Error'}
    post:
      tags: [Studio BFF]
      operationId: createStudioTask
      security: [{cookieAuth: []}]
      parameters:
        - {name: Idempotency-Key, in: header, required: false, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/StudioCreateTaskInput'}}
      responses:
        '200':
          description: Created or idempotently replayed customer task
          content:
            application/json: {schema: {$ref: '#/components/schemas/StudioTaskEnvelope'}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /studio/tasks/{task_id}:
    parameters: [{name: task_id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      tags: [Studio BFF]
      operationId: getStudioTask
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Customer-facing task detail
          content:
            application/json: {schema: {$ref: '#/components/schemas/StudioTaskEnvelope'}}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /studio/tasks/{task_id}/actions:
    parameters: [{name: task_id, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      tags: [Studio BFF]
      operationId: actOnStudioTask
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties: {action: {type: string, enum: [start, pause, resume, retry]}}
      responses:
        '200':
          description: Updated customer task
          content:
            application/json: {schema: {$ref: '#/components/schemas/StudioTaskEnvelope'}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /studio/tasks/{task_id}/inspirations:
    parameters: [{name: task_id, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      tags: [Studio BFF]
      operationId: addStudioInspiration
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/StudioAddInspirationInput'}}
      responses:
        '200':
          description: Updated customer task
          content:
            application/json: {schema: {$ref: '#/components/schemas/StudioTaskEnvelope'}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /studio/tasks/{task_id}/decisions/{decision_id}:
    parameters:
      - {name: task_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: decision_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Studio BFF]
      operationId: decideStudioTaskResult
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: {type: string, enum: [approved, changes_requested]}
                reason: {type: string}
      responses:
        '200':
          description: Updated customer task
          content:
            application/json: {schema: {$ref: '#/components/schemas/StudioTaskEnvelope'}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /studio/tasks/{task_id}/assets:
    parameters: [{name: task_id, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      tags: [Studio BFF]
      operationId: attachStudioTaskAssets
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [asset_refs]
              properties: {asset_refs: {type: array, items: {type: string}}}
      responses:
        '200':
          description: Updated customer task
          content:
            application/json: {schema: {$ref: '#/components/schemas/StudioTaskEnvelope'}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /studio/assets:
    get:
      tags: [Studio BFF]
      operationId: listStudioAssets
      security: [{cookieAuth: []}]
      parameters:
        - {name: project_id, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Customer-facing reusable asset catalog
          content:
            application/json: {schema: {$ref: '#/components/schemas/StudioAssetCatalogEnvelope'}}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /studio/deliveries:
    get:
      tags: [Studio BFF]
      operationId: listStudioDeliveries
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Delivery packages and confirmed publication records
          content:
            application/json: {schema: {$ref: '#/components/schemas/StudioDeliveriesEnvelope'}}
        '401': {$ref: '#/components/responses/Error'}
  /studio/artifacts/{id}/download:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      tags: [Studio BFF]
      operationId: downloadStudioArtifact
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Authorized artifact bytes
          content: {application/octet-stream: {schema: {type: string, format: binary}}}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /bff/admin/runtime/jobs:
    get:
      tags: [Runtime Admin]
      operationId: listRuntimeJobs
      security: [{cookieAuth: []}]
      parameters:
        - {name: project_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: state, in: query, required: false, schema: {type: string}}
        - {name: after, in: query, required: false, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Operations-only Runtime job list
          content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeJobListEnvelope'}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /bff/admin/runtime/jobs/{job_id}:
    parameters: [{name: job_id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      tags: [Runtime Admin]
      operationId: getRuntimeJob
      security: [{cookieAuth: []}]
      responses:
        '200': {description: Runtime job detail, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeJobDetailEnvelope'}}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /bff/admin/runtime/jobs/{job_id}/nodes:
    parameters: [{name: job_id, in: path, required: true, schema: {type: string, format: uuid}}]
    get: *adminJSONRead
  /bff/admin/runtime/jobs/{job_id}/events:
    parameters: [{name: job_id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      tags: [Runtime Admin]
      operationId: listRuntimeEvents
      security: [{cookieAuth: []}]
      parameters: [{name: after, in: query, required: false, schema: {type: integer, minimum: 0}}]
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /bff/admin/runtime/jobs/{job_id}/events/stream:
    parameters: [{name: job_id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      tags: [Runtime Admin]
      operationId: streamRuntimeEvents
      security: [{cookieAuth: []}]
      parameters:
        - {name: after, in: query, required: false, schema: {type: integer, minimum: 0}}
        - {name: Last-Event-ID, in: header, required: false, schema: {type: integer, minimum: 0}}
      responses:
        '200':
          description: Runtime event stream with reconnect cursor
          content: {text/event-stream: {schema: {type: string}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /bff/admin/runtime/jobs/{job_id}/effects:
    parameters: [{name: job_id, in: path, required: true, schema: {type: string, format: uuid}}]
    get: *adminJSONRead
  /bff/admin/runtime/jobs/{job_id}/checkpoints:
    parameters: [{name: job_id, in: path, required: true, schema: {type: string, format: uuid}}]
    get: *adminJSONRead
  /bff/admin/runtime/jobs/{job_id}/refresh:
    parameters: [{name: job_id, in: path, required: true, schema: {type: string, format: uuid}}]
    post: *adminJSONWrite
  /bff/admin/runtime/jobs/{job_id}/cancel:
    parameters: [{name: job_id, in: path, required: true, schema: {type: string, format: uuid}}]
    post: *adminJSONWrite
  /bff/admin/runtime/jobs/{job_id}/resume:
    parameters: [{name: job_id, in: path, required: true, schema: {type: string, format: uuid}}]
    post: *adminJSONWrite
  /bff/runtime/jobs:
    $ref: '#/paths/~1bff~1admin~1runtime~1jobs'
  /bff/runtime/jobs/{job_id}:
    $ref: '#/paths/~1bff~1admin~1runtime~1jobs~1{job_id}'
  /bff/runtime/jobs/{job_id}/nodes:
    $ref: '#/paths/~1bff~1admin~1runtime~1jobs~1{job_id}~1nodes'
  /bff/runtime/jobs/{job_id}/events:
    $ref: '#/paths/~1bff~1admin~1runtime~1jobs~1{job_id}~1events'
  /bff/runtime/jobs/{job_id}/events/stream:
    $ref: '#/paths/~1bff~1admin~1runtime~1jobs~1{job_id}~1events~1stream'
  /bff/runtime/jobs/{job_id}/effects:
    $ref: '#/paths/~1bff~1admin~1runtime~1jobs~1{job_id}~1effects'
  /bff/runtime/jobs/{job_id}/checkpoints:
    $ref: '#/paths/~1bff~1admin~1runtime~1jobs~1{job_id}~1checkpoints'
  /bff/runtime/jobs/{job_id}/refresh:
    $ref: '#/paths/~1bff~1admin~1runtime~1jobs~1{job_id}~1refresh'
  /bff/runtime/jobs/{job_id}/cancel:
    $ref: '#/paths/~1bff~1admin~1runtime~1jobs~1{job_id}~1cancel'
  /bff/runtime/jobs/{job_id}/resume:
    $ref: '#/paths/~1bff~1admin~1runtime~1jobs~1{job_id}~1resume'
  /bff/session:
    get: *jsonRead
  /bff/session/switch:
    post: *jsonWrite
  /bff/session/logout:
    post: *jsonWrite
  /bff/tenants:
    get: *jsonRead
  /bff/team/members:
    get: *jsonRead
  /bff/team/members/{user_id}:
    parameters: [{name: user_id, in: path, required: true, schema: {type: string, format: uuid}}]
    patch: *jsonWrite
  /bff/team/members/{user_id}/revoke:
    parameters: [{name: user_id, in: path, required: true, schema: {type: string, format: uuid}}]
    post: *jsonWrite
  /bff/team/invites:
    get: *jsonRead
    post: *jsonWrite
  /bff/team/invites/accept:
    post: *jsonWrite
  /bff/team/invites/{id}/revoke:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: *jsonWrite
  /bff/dashboard:
    get: *jsonRead
  /bff/projects:
    get: *jsonRead
    post: *jsonWrite
  /bff/projects/{project_id}:
    parameters: [{$ref: '#/components/parameters/ProjectID'}]
    get: *jsonRead
    patch: *jsonWrite
  /bff/projects/{project_id}/archive:
    parameters: [{$ref: '#/components/parameters/ProjectID'}]
    post: *jsonWrite
  /bff/projects/{project_id}/restore:
    parameters: [{$ref: '#/components/parameters/ProjectID'}]
    post: *jsonWrite
  /bff/project-templates:
    get: *jsonRead
    post: *jsonWrite
  /bff/projects/{project_id}/connect-sessions:
    parameters: [{$ref: '#/components/parameters/ProjectID'}]
    post: *jsonWrite
  /bff/connect-sessions/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: *jsonRead
  /bff/connect-sessions/{id}/cancel:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: *jsonWrite
  /bff/projects/{project_id}/devices:
    parameters: [{$ref: '#/components/parameters/ProjectID'}]
    get: *jsonRead
  /bff/devices/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: *jsonRead
  /bff/devices/{id}/revoke:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: *jsonWrite
  /bff/projects/{project_id}/devices/{id}/attach:
    parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/ID'}]
    post: *jsonWrite
  /bff/projects/{project_id}/devices/{id}/detach:
    parameters: [{$ref: '#/components/parameters/ProjectID'}, {$ref: '#/components/parameters/ID'}]
    post: *jsonWrite
  /bff/device-auth/approve:
    post: *jsonWrite
  /bff/projects/{project_id}/sources:
    parameters: [{$ref: '#/components/parameters/ProjectID'}]
    get: *jsonRead
    post: *jsonWrite
  /bff/projects/{project_id}/sources/upload:
    parameters: [{$ref: '#/components/parameters/ProjectID'}]
    post:
      tags: [Web BFF]
      operationId: uploadSource
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, name, source_type]
              properties:
                file: {type: string, format: binary}
                name: {type: string}
                source_type: {type: string}
                file_type: {type: string, description: Optional MIME override when the client cannot provide the file MIME.}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/Error'}
  /bff/sources/{source_id}/revisions:
    parameters: [{name: source_id, in: path, required: true, schema: {type: string, format: uuid}}]
    get: *jsonRead
  /bff/sources/{source_id}/revisions/upload:
    parameters: [{name: source_id, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      tags: [Web BFF]
      operationId: uploadSourceRevision
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                file_type: {type: string, description: Optional MIME override when the client cannot provide the file MIME.}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/Error'}
  /bff/sources/{source_id}/impact:
    parameters: [{name: source_id, in: path, required: true, schema: {type: string, format: uuid}}]
    get: *jsonRead
  /bff/source-revisions/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: *jsonRead
  /bff/source-revisions/{id}/evidence:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: *jsonRead
  /bff/evidence/{id}/review:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: *jsonWrite
  /bff/projects/{project_id}/assets:
    parameters: [{$ref: '#/components/parameters/ProjectID'}]
    get: *jsonRead
    post: *jsonWrite
  /bff/assets/{id}/rights:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: *jsonRead
    post: *jsonWrite
  /bff/rights/{id}/review:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: *jsonWrite
  /bff/projects/{project_id}/knowledge-objects:
    parameters: [{$ref: '#/components/parameters/ProjectID'}]
    get: *jsonRead
    post:
      tags: [Web BFF]
      operationId: createKnowledgeObject
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/CreateKnowledgeObjectInput'}}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /bff/knowledge-objects/{id}/transitions:
    parameters: [{name: id, in: path, required: true, schema: {type: string, minLength: 1}}]
    post:
      tags: [Web BFF]
      operationId: transitionKnowledgeObject
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/ReviewKnowledgeObjectInput'}}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /bff/knowledge-objects/{id}/decisions:
    parameters: [{name: id, in: path, required: true, schema: {type: string, minLength: 1}}]
    get: *jsonRead
  /bff/projects/{project_id}/knowledge-packs:
    parameters: [{$ref: '#/components/parameters/ProjectID'}]
    get: *jsonRead
    post:
      tags: [Web BFF]
      operationId: createKnowledgePack
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/CreateKnowledgePackInput'}}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /bff/knowledge-packs/{id}/publish:
    parameters: [{name: id, in: path, required: true, schema: {type: string, minLength: 1}}]
    post: *jsonWrite
  /bff/knowledge-snapshots/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: *jsonRead
  /bff/knowledge/query:
    post:
      tags: [Web BFF]
      operationId: queryKnowledgeSnapshot

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ContentCloud V2 本地优先业务原型</title>
  <style>
    :root {
      --bg: #f4f5f6;
      --surface: #ffffff;
      --surface-2: #f8f9fa;
      --line: #dfe3e6;
      --line-strong: #c9cfd4;
      --text: #202528;
      --muted: #687177;
      --green: #16704a;
      --green-soft: #e8f4ee;
      --teal: #166b72;
      --teal-soft: #e8f3f4;
      --gold: #8a6419;
      --gold-soft: #f7f0dd;
      --red: #a33b31;
      --red-soft: #faece9;
      --violet: #6551a5;
      --violet-soft: #f0edfa;
      --sidebar: #1f2728;
      --sidebar-muted: #aeb9b9;
      --shadow: 0 8px 24px rgba(24, 34, 35, .08);
      --radius: 6px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0; }
    button, input, select { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 252px minmax(0, 1fr); }
    .sidebar { position: sticky; top: 0; height: 100vh; overflow: auto; background: var(--sidebar); color: #fff; padding: 18px 14px; display: flex; flex-direction: column; gap: 14px; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 12px; border-bottom: 1px solid rgba(255,255,255,.11); }
    .brand-mark { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid #55b28b; color: #bde9d6; font-weight: 800; }
    .brand strong { display: block; font-size: 15px; }
    .brand small { display: block; color: var(--sidebar-muted); margin-top: 2px; }
    .project-switch { border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05); color: #fff; padding: 10px; text-align: left; border-radius: 4px; width: 100%; }
    .project-switch small { display: block; color: var(--sidebar-muted); margin-bottom: 4px; }
    .project-switch span { display: flex; justify-content: space-between; gap: 8px; }
    .nav-label { padding: 5px 9px 3px; color: #829192; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .nav { display: grid; gap: 3px; }
    .nav button { width: 100%; border: 0; background: transparent; color: #c9d1d1; text-align: left; padding: 8px 10px; border-radius: 4px; display: flex; align-items: center; gap: 9px; min-height: 36px; }
    .nav button:hover { background: rgba(255,255,255,.06); color: #fff; }
    .nav button.active { background: #33403f; color: #fff; box-shadow: inset 3px 0 #54b388; }
    .nav-icon { width: 18px; color: #8fb7a5; text-align: center; font-size: 12px; font-weight: 800; }
    .sidebar-foot { margin-top: auto; border-top: 1px solid rgba(255,255,255,.11); padding: 13px 8px 4px; color: var(--sidebar-muted); font-size: 12px; }
    .online { display: flex; gap: 7px; align-items: center; color: #cde9dc; margin-bottom: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #4cc088; flex: none; }
    .main { min-width: 0; }
    .topbar { position: sticky; top: 0; z-index: 4; height: 60px; background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 26px; }
    .breadcrumbs { font-size: 13px; color: var(--muted); }
    .breadcrumbs strong { color: var(--text); font-weight: 650; }
    .top-actions { display: flex; gap: 8px; align-items: center; }
    .search { width: 230px; border: 1px solid var(--line); background: var(--surface-2); padding: 8px 10px; border-radius: 4px; }
    .avatar { width: 30px; height: 30px; background: #e1ebe7; color: var(--green); display: grid; place-items: center; border-radius: 50%; font-weight: 700; }
    .content { padding: 24px 28px 48px; max-width: 1500px; margin: 0 auto; }
    .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin-bottom: 20px; }
    .page-head h1 { font-size: 23px; margin: 0 0 6px; line-height: 1.25; }
    .page-head p { margin: 0; color: var(--muted); font-size: 13px; }
    .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn { border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); border-radius: 4px; padding: 8px 11px; min-height: 34px; font-weight: 600; font-size: 13px; }
    .btn:hover { border-color: #98a2a8; background: #f9fafb; }
    .btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
    .btn.danger { color: var(--red); border-color: #e2b8b2; }
    .btn.quiet { border-color: transparent; background: transparent; color: var(--muted); }
    .btn.small { padding: 5px 8px; min-height: 28px; font-size: 12px; }
    .grid { display: grid; gap: 14px; }
    .grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
    .panel-head { min-height: 48px; padding: 12px 15px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .panel-head h2 { margin: 0; font-size: 14px; }
    .panel-body { padding: 15px; }
    .metric { padding: 15px; min-height: 104px; }
    .metric .label { color: var(--muted); font-size: 12px; }
    .metric strong { display: block; font-size: 25px; margin: 9px 0 4px; }
    .metric small { color: var(--muted); }
    .status { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 7px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .status.ok { background: var(--green-soft); color: var(--green); }
    .status.warn { background: var(--gold-soft); color: var(--gold); }
    .status.bad { background: var(--red-soft); color: var(--red); }
    .status.info { background: var(--teal-soft); color: var(--teal); }
    .status.violet { background: var(--violet-soft); color: var(--violet); }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { text-align: left; color: var(--muted); background: #fafbfb; font-weight: 650; white-space: nowrap; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fafcfa; }
    .link { color: var(--teal); font-weight: 650; background: none; border: 0; padding: 0; text-align: left; }
    .muted { color: var(--muted); }
    .subtle { font-size: 11px; color: var(--muted); }
    .steps { display: grid; grid-template-columns: repeat(4, 1fr); margin-bottom: 18px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); overflow: hidden; }
    .step { position: relative; min-height: 76px; padding: 14px 14px 12px 44px; border-right: 1px solid var(--line); }
    .step:last-child { border-right: 0; }
    .step-no { position: absolute; left: 13px; top: 15px; width: 22px; height: 22px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 50%; font-size: 11px; font-weight: 700; }
    .step.done .step-no { background: var(--green); color: #fff; border-color: var(--green); }
    .step.current { background: #f1f8f4; }
    .step.current .step-no { color: var(--green); border-color: var(--green); }
    .step strong { display: block; font-size: 13px; margin-bottom: 5px; }
    .step small { color: var(--muted); line-height: 1.4; }
    .command { display: flex; align-items: center; gap: 8px; background: #202727; color: #d8e4df; border: 1px solid #303b3a; padding: 12px 13px; border-radius: 4px; overflow: auto; }
    .command code { flex: 1; white-space: nowrap; font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px; }
    .command button { flex: none; border: 1px solid #50605c; background: #2d3836; color: #fff; padding: 6px 8px; border-radius: 3px; }
    .check-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 11px; }
    .check-list li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; }
    .check { width: 19px; height: 19px; display: grid; place-items: center; border-radius: 50%; background: var(--green-soft); color: var(--green); font-size: 11px; font-weight: 800; }
    .check.pending { background: var(--gold-soft); color: var(--gold); }
    .hero-project { display: grid; grid-template-columns: minmax(0, 1fr) 330px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; }
    .hero-copy { padding: 22px; }
    .eyebrow { color: var(--green); font-size: 11px; font-weight: 800; text-transform: uppercase; margin-bottom: 8px; }
    .hero-copy h1 { margin: 0 0 8px; font-size: 25px; }
    .hero-copy p { color: var(--muted); margin: 0 0 18px; max-width: 690px; line-height: 1.65; }
    .hero-image { min-height: 210px; background: #eef0ee; overflow: hidden; }
    .hero-image img { width: 100%; height: 100%; object-fit: cover; object-position: 73% 23%; display: block; }
    .gate { display: grid; grid-template-columns: 96px 1fr 92px; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .gate:last-child { border-bottom: 0; }
    .bar { height: 7px; background: #e8ebed; border-radius: 99px; overflow: hidden; }
    .bar span { display: block; height: 100%; background: var(--green); }
    .split { display: grid; grid-template-columns: 285px minmax(0, 1fr); gap: 14px; }
    .list { display: grid; }
    .list-item { border-bottom: 1px solid var(--line); padding: 12px 14px; text-align: left; background: #fff; border-left: 0; border-top: 0; border-right: 0; }
    .list-item:last-child { border-bottom: 0; }
    .list-item.active { background: #f0f7f3; box-shadow: inset 3px 0 var(--green); }
    .list-item strong { display: block; font-size: 13px; margin-bottom: 5px; }
    .list-item small { color: var(--muted); }
    .timeline { display: grid; grid-template-columns: 70px 1fr; gap: 0 12px; }
    .time { color: var(--muted); font-size: 11px; padding-top: 10px; }
    .event { border-left: 2px solid var(--line); padding: 8px 0 13px 14px; position: relative; }
    .event::before { content: ""; position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--green); left: -5px; top: 12px; }
    .event strong { display: block; font-size: 12px; margin-bottom: 4px; }
    .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 14px; overflow-x: auto; }
    .tabs button { border: 0; background: transparent; padding: 11px 10px 9px; color: var(--muted); white-space: nowrap; border-bottom: 2px solid transparent; }
    .tabs button.active { color: var(--green); border-bottom-color: var(--green); font-weight: 700; }
    .callout { border-left: 3px solid var(--teal); background: var(--teal-soft); padding: 11px 12px; font-size: 12px; line-height: 1.6; }
    .callout.warn { border-color: var(--gold); background: var(--gold-soft); }
    .shot-grid { display: grid; grid-template-columns: 64px 105px 1.4fr 1fr 92px; border-top: 1px solid var(--line); font-size: 12px; }
    .shot-grid > div { padding: 10px; border-bottom: 1px solid var(--line); min-width: 0; }
    .shot-grid .head { color: var(--muted); background: #fafbfb; font-weight: 650; }
    .disclosure { display: inline-flex; align-items: center; gap: 5px; }
    .disclosure::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    .disclosure.meta::before { background: var(--gold); }
    .disclosure.full::before { background: var(--teal); }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(20,26,27,.42); z-index: 20; display: none; align-items: center; justify-content: center; padding: 18px; }
    .modal-backdrop.open { display: flex; }
    .modal { width: min(620px, 100%); background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--line); }
    .modal-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    .modal-head h2 { font-size: 15px; margin: 0; }
    .modal-body { padding: 16px; }
    .modal-foot { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
    .toast { position: fixed; right: 22px; bottom: 22px; z-index: 30; background: #202827; color: #fff; padding: 11px 14px; border-radius: 4px; box-shadow: var(--shadow); transform: translateY(20px); opacity: 0; pointer-events: none; transition: .2s ease; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .empty { text-align: center; padding: 34px 20px; color: var(--muted); }
    @media (max-width: 1100px) {
      .grid.cols-4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .hero-project { grid-template-columns: minmax(0, 1fr) 250px; }
      .shot-grid { grid-template-columns: 58px 90px 1.4fr 1fr; }
      .shot-grid > div:nth-child(5n) { display: none; }
    }
    @media (max-width: 880px) {
      .app { display: block; }
      .sidebar { position: static; height: auto; padding: 10px 12px; overflow: visible; }
      .brand { border: 0; padding-bottom: 5px; }
      .project-switch, .sidebar-foot, .nav-label { display: none; }
      .nav { display: flex; overflow-x: auto; padding-bottom: 4px; }
      .nav button { min-width: max-content; width: auto; }
      .topbar { top: 0; padding: 0 16px; }
      .search { display: none; }
      .content { padding: 18px 16px 36px; }
      .grid.cols-3, .grid.cols-2, .split { grid-template-columns: 1fr; }
      .hero-project { grid-template-columns: 1fr; }
      .hero-image { height: 190px; }
      .steps { grid-template-columns: 1fr 1fr; }
      .step:nth-child(2) { border-right: 0; }
      .step:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
    }
    @media (max-width: 560px) {
      .page-head { display: block; }
      .page-head .actions { margin-top: 12px; }
      .grid.cols-4 { grid-template-columns: 1fr; }
      .steps { grid-template-columns: 1fr; }
      .step { border-right: 0; border-bottom: 1px solid var(--line); }
      .step:last-child { border-bottom: 0; }
      .shot-grid { grid-template-columns: 54px 1fr; }
      .shot-grid > div:nth-child(n) { display: block; }
      .shot-grid .head { display: none !important; }
      .shot-grid > div { border-bottom: 0; }
      .shot-grid > div:nth-child(5n+1) { border-top: 1px solid var(--line); font-weight: 700; }
      .gate { grid-template-columns: 80px 1fr; }
      .gate > :last-child { grid-column: 2; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">CC</div><div><strong>ContentCloud</strong><small>客户内容工作台</small></div></div>
      <button class="project-switch"><small>当前项目</small><span>金陵古都香 · 抖音内容 <b>⌄</b></span></button>
      <div class="nav-label">开始</div>
      <nav class="nav">
        <button class="active" data-view="setup"><span class="nav-icon">01</span>接入与初始化</button>
        <button data-view="overview"><span class="nav-icon">02</span>项目总览</button>
      </nav>
      <div class="nav-label">业务治理</div>
      <nav class="nav">
        <button data-view="knowledge"><span class="nav-icon">K</span>可信知识</button>
        <button data-view="research"><span class="nav-icon">R</span>市场情报</button>
        <button data-view="strategy"><span class="nav-icon">S</span>营销策略</button>
        <button data-view="planning"><span class="nav-icon">P</span>内容策划</button>
        <button data-view="creative"><span class="nav-icon">C</span>创意与剧本</button>
        <button data-view="review"><span class="nav-icon">V</span>审核协作</button>
        <button data-view="delivery"><span class="nav-icon">D</span>交付制作</button>
        <button data-view="learning"><span class="nav-icon">L</span>结果学习</button>
      </nav>
      <div class="nav-label">自动化</div>
      <nav class="nav"><button data-view="automation"><span class="nav-icon">A</span>Automation 与运行</button></nav>
      <div class="sidebar-foot"><div class="online"><span class="dot"></span>本地工作区已连接</div><div>模板 2.0.0 · 12 分钟前同步</div></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="breadcrumbs">南京内容事业部 / 金陵古都香 / <strong id="crumb">接入与初始化</strong></div>
        <div class="top-actions"><input class="search" placeholder="搜索提交、版本或负责人"><button class="btn quiet" title="通知">通知 3</button><div class="avatar">陈</div></div>
      </header>
      <div class="content" id="content"></div>
    </main>
  </div>
  <div class="modal-backdrop" id="modal"><div class="modal"><div class="modal-head"><h2 id="modal-title"></h2><button class="btn quiet" data-close>关闭</button></div><div class="modal-body" id="modal-body"></div><div class="modal-foot"><button class="btn" data-close>取消</button><button class="btn primary" id="modal-copy">复制命令</button></div></div></div>
  <div class="toast" id="toast"></div>
  <script>
    const productImage = "../../../../marketing/jinling-gudu/tmp/images/product-assets-contact-sheet.jpg";
    const names = {setup:"接入与初始化",overview:"项目总览",knowledge:"可信知识",research:"市场情报",strategy:"营销策略",planning:"内容策划",creative:"创意与剧本",review:"审核协作",delivery:"交付制作",learning:"结果学习",automation:"Automation 与运行",run:"运行详情"};
    const head = (title, sub, action="") => `<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${action}</div></div>`;
    const cmd = (text) => `<div class="command"><code>${text}</code><button data-copy="${text.replaceAll('"','&quot;')}">复制</button></div>`;
    const status = (text, kind="ok") => `<span class="status ${kind}">${text}</span>`;
    const metric = (label, value, note) => `<div class="panel metric"><span class="label">${label}</span><strong>${value}</strong><small>${note}</small></div>`;

    function setupView() { return `
      ${head("连接本地创作工作区","项目已在云端创建。下一步在客户电脑初始化知识与剧本工作区。",`<button class="btn" data-action="reset-code">重新生成代码</button>`)}
      <div class="steps">
        <div class="step done"><span class="step-no">✓</span><strong>云端创建项目</strong><small>客户、品牌、模板和角色已锁定</small></div>
        <div class="step current"><span class="step-no">2</span><strong>初始化本地工作区</strong><small>安装模板、Skills、MCP 和校验工具</small></div>
        <div class="step"><span class="step-no">3</span><strong>整理并提交知识</strong><small>原始资料默认保留在本地</small></div>
        <div class="step"><span class="step-no">4</span><strong>进入剧本生产</strong><small>拉取批准知识后在本地继续</small></div>
      </div>
      <div class="grid cols-2">
        <section class="panel"><div class="panel-head"><h2>本机安装命令</h2>${status("代码 23:41 后过期","warn")}</div><div class="panel-body">
          ${cmd("npx --yes @limecloud/contentcloud@latest init --connect cc_init_JLGD_8K4M ./jinling-gudu")}
          <div class="callout" style="margin-top:12px">初始化只创建本地项目文件并绑定云端项目。不会上传 raw 资料，也不会启动后台 Automation。</div>
          <div class="actions" style="margin-top:14px"><button class="btn primary" data-action="mark-init">我已完成初始化</button><button class="btn" data-command="contentcloud workspace doctor">查看诊断命令</button></div>
        </div></section>
        <section class="panel"><div class="panel-head"><h2>项目配置</h2><button class="btn small">编辑</button></div><div class="panel-body"><table>
          <tr><th>客户</th><td>南京本草香料有限公司</td></tr><tr><th>品牌 / 产品</th><td>金陵古都香 / 线香礼盒</td></tr>
          <tr><th>服务模板</th><td>传统品牌 AI 视频内容服务 v2.0</td></tr><tr><th>本地目标</th><td>Codex + Claude Code</td></tr>
          <tr><th>资料策略</th><td>默认 evidence-pack，原件逐项确认</td></tr><tr><th>后台自动化</th><td>${status("未启用","warn")}</td></tr>
        </table></div></section>
      </div>
      <div class="grid cols-3" style="margin-top:14px">
        <section class="panel"><div class="panel-head"><h2>工作区模板</h2>${status("2.0.0","ok")}</div><div class="panel-body"><ul class="check-list"><li><span class="check">✓</span><span>知识本体与词表</span><small>38 files</small></li><li><span class="check">✓</span><span>业务工作流</span><small>12 files</small></li><li><span class="check">✓</span><span>确定性校验</span><small>9 checks</small></li></ul></div></section>
        <section class="panel"><div class="panel-head"><h2>项目级 Skills</h2>${status("11 个","ok")}</div><div class="panel-body"><ul class="check-list"><li><span class="check">✓</span><span>knowledge-content-pipeline</span></li><li><span class="check">✓</span><span>marketing-content-compile</span></li><li><span class="check">✓</span><span>submission-publish</span></li></ul></div></section>
        <section class="panel"><div class="panel-head"><h2>本地 MCP</h2>${status("待确认","warn")}</div><div class="panel-body"><ul class="check-list"><li><span class="check">✓</span><span>ContentCloud local tools</span></li><li><span class="check pending">!</span><span>Claude 项目配置待写入</span><button class="btn small" data-command="contentcloud mcp install --target claude">安装</button></li></ul></div></section>

      <section class="panel" style="margin-top:14px"><div class="panel-head"><h2>Automation Plans</h2><span class="subtle">项目级</span></div><div class="table-wrap"><table><thead><tr><th>计划</th><th>类型</th><th>触发</th><th>工作区</th><th>最近结果</th><th>下次</th><th>状态</th><th></th></tr></thead><tbody><tr><td><button class="link">竞品与平台趋势周监控</button></td><td>Monitor</td><td>每周一 09:00</td><td>Mac Studio / 隔离</td><td><button class="link" data-run>Run #184 · 3个候选</button></td><td>8月3日</td><td>${status("启用","ok")}</td><td><button class="btn small">⋯</button></td></tr><tr><td><button class="link">权利到期检查</button></td><td>Maintain</td><td>每天 08:30</td><td>确定性本地检查</td><td>Run #183 · 无变化</td><td>明天</td><td>${status("启用","ok")}</td><td><button class="btn small">⋯</button></td></tr><tr><td><button class="link">投放结果周复盘</button></td><td>Review</td><td>每周五 17:00</td><td>Mac Studio / 隔离</td><td>Run #177 · 样本不足</td><td>7月31日</td><td>${status("启用","ok")}</td><td><button class="btn small">⋯</button></td></tr><tr><td><button class="link">远程批量剧本候选</button></td><td>Generate</td><td>仅 remote run once</td><td>未授权</td><td>—</td><td>—</td><td>${status("暂停","warn")}</td><td><button class="btn small">⋯</button></td></tr></tbody></table></div></section>
      <div class="callout warn" style="margin-top:14px">Generate 类型不能配置 schedule。启用远程批处理前，需要本地工作区所有者明确授权 Automation 设备和可读取的来源 hash。</div>`; }

    function runView() { return `
      ${head("Run #184","竞品与平台趋势周监控 · Automation 执行诊断",`<button class="btn" data-view="automation">返回计划</button><button class="btn">复制诊断 ID</button>`)}
      <div class="grid cols-4">${metric("状态","Succeeded","7月26日 09:06")}${metric("执行时长","4m 18s","1 次 Attempt")}${metric("输出","3","Research Submission rs_014")}${metric("本地工作区","隔离执行","主目录未修改")}</div>
      <div class="grid cols-2" style="margin-top:14px"><section class="panel"><div class="panel-head"><h2>执行时间线</h2>${status("已完成","ok")}</div><div class="panel-body"><div class="timeline"><div class="time">09:01:42</div><div class="event"><strong>设备领取任务</strong><small>Mac Studio · workspace ws_01</small></div><div class="time">09:01:48</div><div class="event"><strong>验证 ApprovedSnapshot 与本地来源 hash</strong><small>12/12 匹配</small></div><div class="time">09:02:10</div><div class="event"><strong>隔离工作区执行</strong><small>研究公开网页与授权资料</small></div><div class="time">09:06:00</div><div class="event"><strong>本地 lint 通过</strong><small>3 个候选洞察 · 0 个危险文件</small></div><div class="time">09:06:04</div><div class="event"><strong>创建 Research Submission rs_014</strong><small>等待策略人员采纳</small></div></div></div></section><section class="panel"><div class="panel-head"><h2>安全执行摘要</h2><button class="btn small">查看 manifest</button></div><div class="panel-body"><table><tr><th>PlanVersion</th><td>apv_04</td></tr><tr><th>Attempt</th><td>att_184_1</td></tr><tr><th>Capability</th><td>contentcloud.research.monitor@1.2</td></tr><tr><th>输入</th><td>ApprovedSnapshot aps_027 + 12 source hashes</td></tr><tr><th>输出</th><td>Submission rs_014 · revision 1</td></tr><tr><th>Transcript</th><td>仅保留本地，云端未上传</td></tr><tr><th>Usage</th><td>客户端声明 · 仅内部诊断</td></tr></table><div class="actions" style="margin-top:12px"><button class="btn primary" data-view="research">审阅输出</button><button class="btn danger">取消已完成任务</button></div></div></section></div>`; }

    const views = {setup:setupView,overview:overviewView,knowledge:knowledgeView,research:researchView,strategy:strategyView,planning:planningView,creative:creativeView,review:reviewView,delivery:deliveryView,learning:learningView,automation:automationView,run:runView};
    let current = "setup";
    function render(view) {
      current = view;
      document.getElementById("content").innerHTML = views[view]();
      document.getElementById("crumb").textContent = names[view];
      document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("active", b.dataset.view === view));
      window.scrollTo({top:0, behavior:"instant"});
    }
    function showToast(text) { const t=document.getElementById("toast"); t.textContent=text; t.classList.add("show"); clearTimeout(window.toastTimer); window.toastTimer=setTimeout(()=>t.classList.remove("show"),1800); }
    function showCommand(command) { document.getElementById("modal-title").textContent="在本地客户端继续"; document.getElementById("modal-body").innerHTML=`<p class="muted">在已初始化的项目目录中运行：</p>${cmd(command)}<div class="callout" style="margin-top:12px">该操作在本地工作区执行，不创建云端 TaskRun。需要审批时，完成后再执行对应 publish 命令。</div>`; document.getElementById("modal-copy").dataset.copy=command; document.getElementById("modal").classList.add("open"); }
    document.addEventListener("click", async e => {
      const view = e.target.closest("[data-view]")?.dataset.view;
      if (view && views[view]) { render(view); return; }
      if (e.target.closest("[data-run]")) { render("run"); return; }
      const command = e.target.closest("[data-command]")?.dataset.command;
      if (command) { showCommand(command); return; }
      const copy = e.target.closest("[data-copy]")?.dataset.copy || e.target.closest("#modal-copy")?.dataset.copy;
      if (copy) { try { await navigator.clipboard.writeText(copy); showToast("命令已复制"); } catch { showToast("请手动选择命令复制"); } return; }
      if (e.target.closest("[data-close]")) { document.getElementById("modal").classList.remove("open"); return; }
      const action=e.target.closest("[data-action]")?.dataset.action;
      if (action === "reset-code") showToast("已生成新的 init code");
      if (action === "mark-init") { showToast("工作区状态已刷新"); setTimeout(()=>render("overview"),500); }
    });
    document.getElementById("modal").addEventListener("click", e => { if (e.target.id === "modal") e.currentTarget.classList.remove("open"); });
    render(current);
  </script>
</body>

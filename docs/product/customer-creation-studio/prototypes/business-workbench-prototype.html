<body>
  <div class="prototype-shell" id="prototype">
    <header class="platform-header">
      <a class="brand" href="#main" aria-label="Content Work OS 原型首页"><span class="brand-mark" aria-hidden="true">C</span><span class="brand-copy"><strong>Content Work OS</strong><small>业务工作台 UI 原型</small></span></a>
      <div class="workbench-switcher" role="group" aria-label="选择业务工作台">
        <button type="button" data-mode="video" aria-pressed="true">视频生产</button>
        <button type="button" data-mode="article" aria-pressed="false">文章创作</button>
        <button type="button" data-mode="commerce" aria-pressed="false">电商内容</button>

      return `<section class="canvas"><header class="canvas-heading"><div><small>当前阶段 · ${esc(stage[1])}</small><h2>${esc(model().stageCopy[state.stage][0])}</h2><p>${esc(model().stageCopy[state.stage][1])}</p></div><span>需要你的确认</span></header><div class="commerce-layout"><aside class="product-panel"><h3>商品上下文</h3><div class="product-visual">商品图 · 1:1</div><dl class="product-facts"><div><dt>商品名称</dt><dd>轻盈谷物早餐</dd></div><div><dt>主规格</dt><dd>30 袋 / 盒</dd></div><div><dt>资料状态</dt><dd>已确认</dd></div></dl></aside><section class="variant-area"><h3>内容变体矩阵</h3><p>围绕已确认商品事实，准备不同渠道需要的表达。</p><table class="variant-table"><thead><tr><th>渠道</th><th>内容对象</th><th>当前版本</th></tr></thead><tbody><tr><td><strong>短视频</strong><small>9:16 · 30 秒</small></td><td><strong>口播脚本</strong><small>早上没时间？一杯谷物组合...</small></td><td><span class="status">待确认</span></td></tr><tr><td><strong>商品卡</strong><small>标题 ≤ 30 字</small></td><td><strong>商品标题</strong><small>轻盈谷物早餐组合｜快速准备</small></td><td><span class="status">待确认</span></td></tr><tr><td><strong>图文</strong><small>首屏 + 三段卖点</small></td><td><strong>图文内容</strong><small>把早餐变简单，从一份谷物开始。</small></td><td><span class="status">草稿</span></td></tr></tbody></table><button class="primary-button" type="button" data-primary>${model().primary}</button></section>${context('渠道上下文',[['内容规则','3 个渠道模板','长度、比例和行动引导分别检查。'],['当前版本','v2 · 草稿','正式交付前保留每个变体的来源。'],['下一步','生成并检查渠道变体','生成后仍由你确认。']],model().primary)}</div></section>`;

    function novelCanvas(){
      const stage=currentStage();
      const reviewing=state.stage==='continuity'||state.stage==='edit'||state.stage==='delivery';
      const action=state.stage==='canon'?'保存 Canon':state.stage==='outline'?'确认卷章规划':state.stage==='chapter'?'提交章节审核':state.stage==='continuity'?'确认校验结果':state.stage==='edit'?'批准章节':'生成章节交付包';
      return `<section class="canvas"><header class="canvas-heading"><div><small>当前阶段 · ${esc(stage[1])}</small><h2>${esc(model().stageCopy[state.stage][0])}</h2><p>${esc(model().stageCopy[state.stage][1])}</p></div><span>${reviewing?'受统一门禁治理':'章节工作中'}</span></header><div class="novel-layout"><aside class="novel-ledger"><h3>Canon 与卷章引用</h3><ul class="canon-list"><li><strong>港城潮汐规则</strong><small>Canon v4 · 已固定</small></li><li><strong>林昭 · 角色状态</strong><small>仍不知道来信来源</small></li><li><strong>失踪者伏笔</strong><small>第 3 卷 · 线索 07</small></li><li><strong>时间线</strong><small>雾历 28 年 · 第 14 日</small></li></ul></aside><article class="chapter-editor"><header><small>章节正文 · 自动保存</small><h3 contenteditable="true" data-pretext>第 12 章 · 潮汐表</h3><p class="chapter-meta">2,840 字 · Canon v4 · 卷章规划 v3 · 7 项固定引用</p></header><p contenteditable="true" data-pretext>潮水退到旧码头第三根石柱时，林昭才看见夹在锈蚀铁环下的那封信。信封没有署名，纸面却带着港务局只在冬季使用的蓝色水印。</p><p contenteditable="true" data-pretext>她没有立刻拆开。远处的报时钟刚敲过六下，而潮汐表上写着，今天的最低水位应该在七点之后。</p><div class="continuity-result">连续性摘要：角色知识边界、地点、时间线和伏笔引用均可追溯；只有服务器批准后才能生成章节交付。</div><button class="primary-button" type="button" data-primary>${esc(action)}</button></article>${context('章节治理',[['当前事实','SubmissionRevision 草稿','正文不会直接成为批准版本。'],['门禁',reviewing?'连续性与审核记录已加载':'提交后进入内部审核','工作台不能自行写 ApprovedSnapshot。'],['下一步',action,'交付只引用批准章节快照。']],action)}</div></section>`;
    }
    function render(){
      const current=model();
      if(!current.stages.some(stage=>stage[0]===state.stage))state.stage=current.stages[0][0];
      const stage=currentStage();
      document.documentElement.style.setProperty('--accent',current.accent);
      document.documentElement.style.setProperty('--accent-soft',current.soft);
      const canvas=current===models.video?videoCanvas():current===models.article?articleCanvas():current===models.commerce?commerceCanvas():novelCanvas();
      app.innerHTML=`<header class="workbench-head"><div><span class="eyebrow"><i aria-hidden="true"></i>${esc(current.name)}</span><h1 contenteditable="true" data-pretext>${esc(current.title)}</h1><p contenteditable="true" data-pretext>${esc(current.brief)}</p></div><div class="head-actions"><span class="save-state" role="status">${esc(state.save)}</span><button class="secondary-button" type="button" data-save>保存修改</button><button class="primary-button" type="button" data-primary>${esc(current.primary)}</button></div></header>${workbenchNav()}${stageTrack()}${canvas}`;
      wire();
      window.lucide?.createIcons?.();
      relayout();
    }
    function setSave(message){state.save=message;const node=document.querySelector('.save-state');if(node)node.textContent=message}
    function wire(){
      document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{state.mode=button.dataset.mode;state.stage=models[state.mode].stages[0][0];state.save='已切换工作台 · 尚未保存';document.querySelectorAll('[data-mode]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));render()}));
      document.querySelectorAll('[data-stage]').forEach(button=>button.addEventListener('click',()=>{state.stage=button.dataset.stage;state.save=`已打开“${currentStage()[1]}”`;render()}));
      document.querySelectorAll('[data-primary]').forEach(button=>button.addEventListener('click',()=>setSave(`已记录：${button.textContent.trim()} · 原型状态`)));
      document.querySelectorAll('[data-save]').forEach(button=>button.addEventListener('click',()=>setSave('已保存 · 刚刚')));
      document.querySelectorAll('[contenteditable]').forEach(element=>element.addEventListener('input',()=>setSave('有未保存修改')));
    }
    function relayout(){
      document.querySelectorAll('[data-pretext]').forEach(element=>{element.style.height='auto';if(pretext?.prepare&&pretext?.layout){const handle=pretext.prepare(element.textContent||'',getComputedStyle(element).font);const result=pretext.layout(handle,element.clientWidth,parseFloat(getComputedStyle(element).lineHeight)||20);element.style.height=`${result.height}px`}});
    }
    const observer=new MutationObserver(()=>relayout());
    observer.observe(app,{subtree:true,characterData:true,childList:true});
    const resizeObserver=new ResizeObserver(()=>relayout());
    resizeObserver.observe(app);
    document.fonts?.ready.then(relayout);
    import('https://esm.sh/@chenglou/pretext').then(module=>{pretext=module;relayout()}).catch(()=>{pretext=null;relayout()});
    render();
  </script>
